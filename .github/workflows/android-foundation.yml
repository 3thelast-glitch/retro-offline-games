name: Android foundation APK (no PSP)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Unit tests and web build
        run: |
          npm test
          npm run build
      - name: Generate Capacitor Android foundation project
        run: |
          npx cap add android
          npx cap sync android
      - name: Build Android debug APK (original puzzle only)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon
      - name: Verify APK exists
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'assets/public/(index.html|assets/)' | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: retro-offline-games-foundation-debug-no-psp
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
